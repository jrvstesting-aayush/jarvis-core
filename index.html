<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>J.A.R.V.I.S.</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #070a13; color: #e2e8f0; display: flex; flex-direction: column; height: 100dvh; }
    
    /* Security Lock Screen */
    #lock-screen { position: fixed; inset: 0; background: #070a13; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; padding: 20px; text-align: center; }
    #lock-screen h2 { color: #38bdf8; letter-spacing: 3px; margin-bottom: 8px; font-size: 1.4rem; }
    #lock-screen p { color: #64748b; font-size: 0.85rem; margin-bottom: 24px; }
    #pin-input { background: #0f172a; border: 1px solid #1e293b; color: #38bdf8; font-size: 1.5rem; text-align: center; letter-spacing: 6px; padding: 12px; border-radius: 12px; width: 180px; outline: none; margin-bottom: 16px; }
    #unlock-btn { background: #0284c7; color: #fff; border: none; padding: 12px 28px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    #error-msg { color: #f43f5e; font-size: 0.85rem; margin-top: 12px; display: none; }

    /* App UI */
    header { padding: 16px; text-align: center; border-bottom: 1px solid #1e293b; background: #0f172a; }
    header h1 { font-size: 1.1rem; letter-spacing: 3px; color: #38bdf8; }
    #chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 85%; padding: 12px 16px; border-radius: 14px; line-height: 1.5; font-size: 0.95rem; word-break: break-word; }
    .user { align-self: flex-end; background: #0284c7; color: #fff; border-bottom-right-radius: 2px; }
    .jarvis { align-self: flex-start; background: #111827; color: #e2e8f0; border-bottom-left-radius: 2px; border: 1px solid #1f2937; }
    .cursor { display: inline-block; width: 6px; height: 14px; background: #38bdf8; animation: blink 0.8s infinite; vertical-align: middle; }
    @keyframes blink { 50% { opacity: 0; } }
    #input-form { display: flex; gap: 8px; padding: 12px; background: #0f172a; border-top: 1px solid #1e293b; }
    input[type="text"] { flex: 1; padding: 12px 16px; border-radius: 24px; border: 1px solid #334155; background: #1e293b; color: #fff; outline: none; font-size: 1rem; }
    #send-btn { background: #38bdf8; border: none; color: #070a13; font-weight: bold; padding: 0 18px; border-radius: 24px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Security Screen -->
  <div id="lock-screen">
    <h2>STARK SECURITY</h2>
    <p>FAMILY ACCESS ONLY</p>
    <input type="password" id="pin-input" maxlength="6" placeholder="••••" inputmode="numeric" />
    <button id="unlock-btn" onclick="verifyPin()">AUTHENTICATE</button>
    <p id="error-msg">Access Denied. Invalid Authorization Code.</p>
  </div>

  <!-- Main Chat App -->
  <header><h1>J.A.R.V.I.S.</h1></header>
  <div id="chat-box">
    <div class="msg jarvis">Security protocol cleared. Good day, Sir. All systems are fully operational.</div>
  </div>
  <form id="input-form">
    <input id="user-input" type="text" placeholder="Ask J.A.R.V.I.S..." autocomplete="off" required />
    <button type="submit" id="send-btn">Send</button>
  </form>

  <script>
    const API_KEY = "AQ.Ab8RN6JkZRVtfWTfMLunb0LG8kYSOuWIEhARhf8F5CtKfUy7eA";
    const FAMILY_PIN = "2911";

    const SYSTEM_PROMPT = "You are J.A.R.V.I.S., a sophisticated, witty, and loyal AI assistant created by Tony Stark. Address the user respectfully as 'Sir' or 'Boss' and keep answers concise, intelligent, and sharp.";

    const chatBox = document.getElementById("chat-box");
    const form = document.getElementById("input-form");
    const input = document.getElementById("user-input");

    if (localStorage.getItem("jarvis_auth") === "true") {
      document.getElementById("lock-screen").style.display = "none";
    }

    function verifyPin() {
      const pin = document.getElementById("pin-input").value;
      if (pin === FAMILY_PIN) {
        localStorage.setItem("jarvis_auth", "true");
        document.getElementById("lock-screen").style.display = "none";
      } else {
        document.getElementById("error-msg").style.display = "block";
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, "user");
      input.value = "";

      const jarvisBubble = appendMessage("", "jarvis");
      const cursor = document.createElement("span");
      cursor.className = "cursor";
      jarvisBubble.appendChild(cursor);

      try {
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,
          {
            method: "POST",
            headers: { 
              "Content-Type": "application/json",
              "x-goog-api-key": API_KEY 
            },
            body: JSON.stringify({
              contents: [{ role: "user", parts: [{ text: `${SYSTEM_PROMPT}\n\nUser: ${text}` }] }]
            })
          }
        );

        const data = await response.json();
        
        if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
          const reply = data.candidates[0].content.parts[0].text;
          await typeWriter(reply, jarvisBubble, cursor);
        } else if (data.error) {
          jarvisBubble.textContent = `Diagnostic error: ${data.error.message}`;
        } else {
          jarvisBubble.textContent = "I was unable to process that request, Sir.";
        }
      } catch (err) {
        jarvisBubble.textContent = "Satellite uplink disrupted. Please check network connection.";
      }
    });

    function appendMessage(text, sender) {
      const div = document.createElement("div");
      div.className = `msg ${sender}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    function typeWriter(text, element, cursor) {
      return new Promise((resolve) => {
        let i = 0;
        element.textContent = "";
        element.appendChild(cursor);
        
        const interval = setInterval(() => {
          if (i < text.length) {
            cursor.insertAdjacentText("beforebegin", text.charAt(i));
            i++;
            chatBox.scrollTop = chatBox.scrollHeight;
          } else {
            clearInterval(interval);
            cursor.remove();
            resolve();
          }
        }, 15);
      });
    }
  </script>
</body>
</html>
