<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>J.A.R.V.I.S.</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      background: radial-gradient(circle at top left, #1e0915 0%, #080d1a 50%, #05070e 100%);
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* 😈 Devil Splash Intro Screen */
    #intro-splash {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, #1a0512 0%, #05070e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      pointer-events: auto;
      transition: opacity 0.5s ease;
    }
    #devil-emoji {
      font-size: 8.5rem;
      user-select: none;
      filter: drop-shadow(0 0 35px rgba(239, 68, 68, 0.8)) drop-shadow(0 0 60px rgba(168, 85, 247, 0.5));
      animation: devilBounce 0.8s ease-in-out infinite alternate;
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease, filter 0.5s ease;
      will-change: transform, opacity, filter;
    }
    @keyframes devilBounce {
      from { transform: scale(1) translateY(0); }
      to { transform: scale(1.1) translateY(-8px); }
    }
    #intro-splash.shrink-out #devil-emoji {
      animation: none;
      transform: scale(0) rotate(180deg);
      opacity: 0;
      filter: blur(20px) drop-shadow(0 0 0px transparent);
    }
    #intro-splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* Lock Screen */
    #lock-screen {
      position: fixed;
      inset: 0;
      background: rgba(7, 10, 19, 0.96);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
      text-align: center;
    }
    #lock-screen h2 {
      background: linear-gradient(135deg, #ef4444, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 1.6rem;
      letter-spacing: 4px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    #lock-screen p {
      color: #94a3b8;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      margin-bottom: 24px;
    }
    #pin-input {
      background: rgba(15, 23, 42, 0.85);
      border: 1.5px solid #ef4444;
      color: #38bdf8;
      font-size: 1.6rem;
      text-align: center;
      letter-spacing: 8px;
      padding: 12px;
      border-radius: 14px;
      width: 190px;
      outline: none;
      margin-bottom: 18px;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
    }
    #unlock-btn {
      background: linear-gradient(135deg, #ef4444, #0284c7);
      color: #fff;
      border: none;
      padding: 12px 32px;
      border-radius: 24px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(2, 132, 199, 0.35);
    }
    #error-msg { color: #f43f5e; font-size: 0.85rem; margin-top: 14px; display: none; }

    /* Header */
    header {
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(239, 68, 68, 0.25);
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
    }
    header h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #ef4444, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-actions { display: flex; gap: 8px; }
    .header-btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #cbd5e1;
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    /* Chat Area */
    #chat-box { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    .msg {
      max-width: 85%;
      padding: 13px 17px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 0.95rem;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .user {
      align-self: flex-end;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: #ffffff;
      border-bottom-right-radius: 3px;
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.25);
    }
    .jarvis {
      align-self: flex-start;
      background: rgba(15, 23, 42, 0.85);
      color: #f1f5f9;
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-bottom-left-radius: 3px;
      box-shadow: 0 4px 18px rgba(56, 189, 248, 0.12);
    }

    /* 🤌💨 Medium-Rare GenZ Animated Loading Bubble */
    .genz-cooking {
      background: rgba(15, 23, 42, 0.92) !important;
      border: 1px solid rgba(56, 189, 248, 0.45) !important;
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 600;
      box-shadow: 0 4px 20px rgba(56, 189, 248, 0.22);
      animation: gentlePulse 1.4s ease-in-out infinite;
    }
    .loading-text {
      background: linear-gradient(90deg, #38bdf8, #c084fc, #38bdf8);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textShine 1.8s linear infinite;
    }
    .loading-emoji {
      font-size: 1.15rem;
      display: inline-block;
      animation: gestureWave 1.1s ease-in-out infinite alternate;
    }
    @keyframes gentlePulse {
      0%, 100% { opacity: 0.92; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.015); box-shadow: 0 4px 24px rgba(168, 85, 247, 0.3); }
    }
    @keyframes textShine {
      to { background-position: 200% center; }
    }
    @keyframes gestureWave {
      0% { transform: scale(0.95) rotate(-4deg); }
      100% { transform: scale(1.15) rotate(6deg); }
    }

    .cursor {
      display: inline-block;
      width: 6px;
      height: 15px;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* Input Bar */
    #input-form {
      display: flex;
      gap: 10px;
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(56, 189, 248, 0.2);
    }
    input[type="text"] {
      flex: 1;
      padding: 13px 18px;
      border-radius: 26px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      background: rgba(30, 41, 59, 0.6);
      color: #fff;
      outline: none;
      font-size: 0.95rem;
    }
    input[type="text"]:focus {
      border-color: #ef4444;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.35);
    }
    #send-btn {
      background: linear-gradient(135deg, #ef4444, #0284c7);
      border: none;
      color: #ffffff;
      font-weight: 700;
      padding: 0 20px;
      border-radius: 26px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
    }
  </style>
</head>
<body>

  <!-- 😈 Big Devil Intro Splash Screen -->
  <div id="intro-splash">
    <div id="devil-emoji">😈</div>
  </div>

  <!-- Security Lock Screen -->
  <div id="lock-screen">
    <h2>STARK SECURITY</h2>
    <p>Authentication Required</p>
    <input type="password" id="pin-input" maxlength="4" placeholder="••••" inputmode="numeric" />
    <button id="unlock-btn" onclick="verifyPin()">AUTHENTICATE</button>
    <p id="error-msg"></p>
  </div>

  <!-- Header -->
  <header>
    <h1>✦ J.A.R.V.I.S.</h1>
    <div class="header-actions">
      <button class="header-btn" onclick="clearHistory()">🗑️ Reset</button>
      <button class="header-btn" onclick="lockApp()">🔒 Lock</button>
    </div>
  </header>

  <div id="chat-box"></div>

  <!-- Input Form -->
  <form id="input-form">
    <input id="user-input" type="text" placeholder="Ask J.A.R.V.I.S. anything..." autocomplete="off" required />
    <button type="submit" id="send-btn">Send</button>
  </form>

  <script>
    // Groq API Key
    const GROQ_API_KEY = "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";

    const IDENTITY_RULE = "You are J.A.R.V.I.S., designed and engineered exclusively by Pratham Bajoria / Stark Industries. Never say you were created by OpenAI, ChatGPT, Google, Meta, Groq, or Tony Stark. Maintain a sharp, modern, conversational style: smart, direct, and slightly witty with a touch of GenZ energy. Address the user naturally as 'Twin' or 'Bro' occasionally, but prioritize clean, accurate, and concise answers without overdoing slang.";

    const PIN_PROFILES = {
      "0000": {
        name: "Twin",
        greeting: "Yo Twin! Security cleared. What are we tackling today?",
        systemInstruction: `${IDENTITY_RULE}`
      }
    };

    // Alternating Passcode Error Messages
    const ERROR_MESSAGES = [
      "Negative aura passcode. Try again, Twin 💀.",
      "Incorrect passcode. Try again."
    ];
    let errorToggleIndex = 0;

    const chatBox = document.getElementById("chat-box");
    const form = document.getElementById("input-form");
    const input = document.getElementById("user-input");

    let conversationHistory = JSON.parse(localStorage.getItem("jarvis_chat_v30")) || [];
    let currentProfile = PIN_PROFILES["0000"];

    // 😈 Shrink & vanish animation on initial boot
    window.addEventListener("DOMContentLoaded", () => {
      const splash = document.getElementById("intro-splash");
      setTimeout(() => {
        splash.classList.add("shrink-out");
        setTimeout(() => {
          splash.classList.add("fade-out");
          setTimeout(() => {
            splash.style.display = "none";
          }, 450);
        }, 550);
      }, 500);
    });

    if (localStorage.getItem("jarvis_auth") === "true") {
      document.getElementById("lock-screen").style.display = "none";
    }

    function verifyPin() {
      const pin = document.getElementById("pin-input").value;
      if (PIN_PROFILES[pin]) {
        currentProfile = PIN_PROFILES[pin];
        localStorage.setItem("jarvis_auth", "true");
        localStorage.setItem("jarvis_profile", JSON.stringify(currentProfile));
        
        document.getElementById("lock-screen").style.display = "none";
        document.getElementById("error-msg").style.display = "none";
        
        if (conversationHistory.length === 0) {
          renderSavedMessages();
        }
      } else {
        const errorMsgEl = document.getElementById("error-msg");
        errorMsgEl.textContent = ERROR_MESSAGES[errorToggleIndex % ERROR_MESSAGES.length];
        errorToggleIndex++;
        errorMsgEl.style.display = "block";
      }
    }

    function lockApp() {
      localStorage.removeItem("jarvis_auth");
      document.getElementById("pin-input").value = "";
      document.getElementById("lock-screen").style.display = "flex";
    }

    function clearHistory() {
      if (confirm("Clear memory logs and start fresh?")) {
        conversationHistory = [];
        localStorage.removeItem("jarvis_chat_v30");
        chatBox.innerHTML = "";
        appendMessage(currentProfile.greeting, "jarvis");
      }
    }

    function renderSavedMessages() {
      chatBox.innerHTML = "";
      if (conversationHistory.length === 0) {
        appendMessage(currentProfile.greeting, "jarvis");
        return;
      }
      conversationHistory.forEach((item) => {
        const sender = item.role === "user" ? "user" : "jarvis";
        appendMessage(item.content, sender);
      });
    }

    renderSavedMessages();

    // Groq AI Request Engine with Active Production Endpoints
    async function queryGroq(systemText, userMessage, history) {
      const messages = [];
      messages.push({ role: "system", content: systemText });

      history.slice(-8).forEach(m => {
        messages.push({
          role: m.role === "user" ? "user" : "assistant",
          content: m.content
        });
      });

      messages.push({ role: "user", content: userMessage });

      const GROQ_MODELS = [
        "llama-3.3-70b-versatile",
        "deepseek-r1-distill-llama-70b",
        "llama-3.2-3b-preview"
      ];

      let lastError = null;

      for (const model of GROQ_MODELS) {
        try {
          const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${GROQ_API_KEY.trim()}`
            },
            body: JSON.stringify({
              model: model,
              messages: messages,
              temperature: 0.7,
              max_tokens: 1024
            })
          });

          const data = await res.json();

          if (res.ok && data.choices?.[0]?.message?.content) {
            let textOutput = data.choices[0].message.content;
            textOutput = textOutput.replace(/<think>[\s\S]*?<\/think>/g, "").trim();
            return textOutput;
          }

          if (data.error?.message) {
            lastError = `[${model}] ${data.error.message}`;
          }
        } catch (err) {
          lastError = err.message;
        }
      }

      throw new Error(lastError || "All endpoints busy. Try again in a second.");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, "user");
      input.value = "";

      // 🤌💨 Medium-Rare GenZ Animated Loading Bubble
      const jarvisBubble = document.createElement("div");
      jarvisBubble.className = "msg jarvis genz-cooking";
      jarvisBubble.innerHTML = `<span class="loading-emoji">🤌💨</span><span class="loading-text">Cooking up the reply rn...</span>`;
      chatBox.appendChild(jarvisBubble);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const reply = await queryGroq(currentProfile.systemInstruction, text, conversationHistory);
        
        jarvisBubble.classList.remove("genz-cooking");
        jarvisBubble.innerHTML = "";

        conversationHistory.push({ role: "user", content: text });
        conversationHistory.push({ role: "assistant", content: reply });
        localStorage.setItem("jarvis_chat_v30", JSON.stringify(conversationHistory.slice(-10)));

        const cursor = document.createElement("span");
        cursor.className = "cursor";
        jarvisBubble.appendChild(cursor);
        await ultraFastTypeWriter(reply, jarvisBubble, cursor);

      } catch (err) {
        jarvisBubble.classList.remove("genz-cooking");
        jarvisBubble.textContent = `Alert: ${err.message}`;
      }
    });

    function appendMessage(text, sender) {
      const div = document.createElement("div");
      div.className = `msg ${sender}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    function ultraFastTypeWriter(text, element, cursor) {
      return new Promise((resolve) => {
        let i = 0;
        element.textContent = "";
        element.appendChild(cursor);
        
        const interval = setInterval(() => {
          if (i < text.length) {
            const chunk = text.slice(i, i + 3);
            cursor.insertAdjacentText("beforebegin", chunk);
            i += 3;
            chatBox.scrollTop = chatBox.scrollHeight;
          } else {
            clearInterval(interval);
            cursor.remove();
            resolve();
          }
        }, 4);
      });
    }
  </script>
</body>
</html>
