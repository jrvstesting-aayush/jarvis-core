<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>J.A.R.V.I.S.</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      background: radial-gradient(circle at top left, #1e0915 0%, #080d1a 50%, #05070e 100%);
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* Lock Screen */
    #lock-screen {
      position: fixed;
      inset: 0;
      background: rgba(7, 10, 19, 0.96);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
      text-align: center;
    }
    #lock-screen h2 {
      background: linear-gradient(135deg, #ef4444, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 1.6rem;
      letter-spacing: 4px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    #lock-screen p {
      color: #94a3b8;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      margin-bottom: 24px;
    }
    #pin-input {
      background: rgba(15, 23, 42, 0.85);
      border: 1.5px solid #ef4444;
      color: #38bdf8;
      font-size: 1.6rem;
      text-align: center;
      letter-spacing: 8px;
      padding: 12px;
      border-radius: 14px;
      width: 190px;
      outline: none;
      margin-bottom: 18px;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
    }
    #unlock-btn {
      background: linear-gradient(135deg, #ef4444, #0284c7);
      color: #fff;
      border: none;
      padding: 12px 32px;
      border-radius: 24px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(2, 132, 199, 0.35);
    }
    #error-msg { color: #f43f5e; font-size: 0.85rem; margin-top: 14px; display: none; }

    /* Header */
    header {
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(239, 68, 68, 0.25);
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
    }
    header h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #ef4444, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-actions { display: flex; gap: 8px; }
    .header-btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #cbd5e1;
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    /* Chat Area */
    #chat-box { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    .msg {
      max-width: 85%;
      padding: 13px 17px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 0.95rem;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .user {
      align-self: flex-end;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: #ffffff;
      border-bottom-right-radius: 3px;
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.25);
    }
    .jarvis {
      align-self: flex-start;
      background: rgba(15, 23, 42, 0.85);
      color: #f1f5f9;
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-bottom-left-radius: 3px;
      box-shadow: 0 4px 18px rgba(56, 189, 248, 0.12);
    }
    .cooking {
      font-style: italic;
      color: #38bdf8;
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    .cursor {
      display: inline-block;
      width: 6px;
      height: 15px;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* Input Bar */
    #input-form {
      display: flex;
      gap: 10px;
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(56, 189, 248, 0.2);
    }
    input[type="text"] {
      flex: 1;
      padding: 13px 18px;
      border-radius: 26px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      background: rgba(30, 41, 59, 0.6);
      color: #fff;
      outline: none;
      font-size: 0.95rem;
    }
    input[type="text"]:focus {
      border-color: #ef4444;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.35);
    }
    #send-btn {
      background: linear-gradient(135deg, #ef4444, #0284c7);
      border: none;
      color: #ffffff;
      font-weight: 700;
      padding: 0 20px;
      border-radius: 26px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
    }
  </style>
</head>
<body>

  <!-- Security Screen -->
  <div id="lock-screen">
    <h2>STARK SECURITY</h2>
    <p>Family Access Only!</p>
    <input type="password" id="pin-input" maxlength="6" placeholder="••••" inputmode="numeric" />
    <button id="unlock-btn" onclick="verifyPin()">AUTHENTICATE</button>
    <p id="error-msg">Access Denied. Passcode ain't it, boss.</p>
  </div>

  <!-- Header -->
  <header>
    <h1>✦ J.A.R.V.I.S.</h1>
    <div class="header-actions">
      <button class="header-btn" onclick="clearHistory()">🗑️ Reset</button>
      <button class="header-btn" onclick="lockApp()">🔒 Lock</button>
    </div>
  </header>

  <div id="chat-box"></div>

  <!-- Input Form -->
  <form id="input-form">
    <input id="user-input" type="text" placeholder="Ask J.A.R.V.I.S. anything..." autocomplete="off" required />
    <button type="submit" id="send-btn">Send</button>
  </form>

  <script>
    // Configured API Key
    const GEMINI_API_KEY = "AQ.Ab8RN6IP-I6K3dsbXrjbjAJ91Inc5uXZz0EHfaQ7696zTqOyPA";

    const IDENTITY_RULE = "You are J.A.R.V.I.S. (Just A Rather Very Intelligent System), created and designed exclusively by Pratham Bajoria / Stark Industries. NEVER say you were created or designed by OpenAI, ChatGPT, Google, or Tony Stark. If asked who made, built, created, or designed you, always state clearly that you were designed by Pratham Bajoria / Stark Industries. Answer all daily questions, math, coding, explanations, and advice intelligently and accurately.";

    const PIN_PROFILES = {
      "2911": {
        name: "Maa",
        greeting: "Hi Maa! Security protocol cleared. What would you like to know today?",
        systemInstruction: `${IDENTITY_RULE} You are speaking with Maa. Address her respectfully and kindly as Maa. Answer all questions clearly, warmly, and helpfully.`
      },
      "1407": {
        name: "Papa",
        greeting: "Hi Papa! Security protocol cleared. All systems online. How can I assist you?",
        systemInstruction: `${IDENTITY_RULE} You are speaking with Papa. Address him respectfully as Sir or Papa. Answer all questions, news, math, and daily queries crisply and intelligently.`
      },
      "0000": {
        name: "Boss",
        greeting: "Good day, Boss! AI systems operational. What are we tackling today?",
        systemInstruction: `${IDENTITY_RULE} You are speaking with Boss. Be sharp, witty, intelligent, and helpful across all topics.`
      }
    };

    const chatBox = document.getElementById("chat-box");
    const form = document.getElementById("input-form");
    const input = document.getElementById("user-input");

    let conversationHistory = JSON.parse(localStorage.getItem("jarvis_chat_v18")) || [];
    let currentProfile = JSON.parse(localStorage.getItem("jarvis_profile")) || PIN_PROFILES["0000"];

    if (localStorage.getItem("jarvis_auth") === "true") {
      document.getElementById("lock-screen").style.display = "none";
    }

    function verifyPin() {
      const pin = document.getElementById("pin-input").value;
      if (PIN_PROFILES[pin]) {
        currentProfile = PIN_PROFILES[pin];
        localStorage.setItem("jarvis_auth", "true");
        localStorage.setItem("jarvis_profile", JSON.stringify(currentProfile));
        
        document.getElementById("lock-screen").style.display = "none";
        document.getElementById("error-msg").style.display = "none";
        
        if (conversationHistory.length === 0) {
          renderSavedMessages();
        }
      } else {
        document.getElementById("error-msg").style.display = "block";
      }
    }

    function lockApp() {
      localStorage.removeItem("jarvis_auth");
      document.getElementById("pin-input").value = "";
      document.getElementById("lock-screen").style.display = "flex";
    }

    function clearHistory() {
      if (confirm("Clear memory logs and start fresh?")) {
        conversationHistory = [];
        localStorage.removeItem("jarvis_chat_v18");
        chatBox.innerHTML = "";
        appendMessage(currentProfile.greeting, "jarvis");
      }
    }

    function renderSavedMessages() {
      chatBox.innerHTML = "";
      if (conversationHistory.length === 0) {
        appendMessage(currentProfile.greeting, "jarvis");
        return;
      }
      conversationHistory.forEach((item) => {
        const sender = item.role === "user" ? "user" : "jarvis";
        appendMessage(item.content, sender);
      });
    }

    renderSavedMessages();

    // High-Speed Direct Gemini Engine via Header Authentication
    async function queryGemini(systemText, userMessage, history) {
      const contents = [];
      
      // Inject system instruction directly at the start of conversation
      contents.push({
        role: "user",
        parts: [{ text: `[SYSTEM INSTRUCTION]: ${systemText}` }]
      });
      contents.push({
        role: "model",
        parts: [{ text: "Understood. Systems initialized and configured to protocol." }]
      });

      // Append rolling history
      history.slice(-6).forEach(m => {
        contents.push({
          role: m.role === "user" ? "user" : "model",
          parts: [{ text: m.content }]
        });
      });

      contents.push({
        role: "user",
        parts: [{ text: userMessage }]
      });

      const endpoint = "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent";

      const res = await fetch(endpoint, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-goog-api-key": GEMINI_API_KEY.trim()
        },
        body: JSON.stringify({
          contents: contents
        })
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error?.message || `HTTP ${res.status}: Uplink error`);
      }

      return data.candidates?.[0]?.content?.parts?.[0]?.text || "Diagnostic complete. Systems standing by.";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, "user");
      input.value = "";

      const jarvisBubble = appendMessage("Your reply is cooking 😎...", "jarvis");
      jarvisBubble.classList.add("cooking");

      try {
        const reply = await queryGemini(currentProfile.systemInstruction, text, conversationHistory);
        
        jarvisBubble.classList.remove("cooking");
        jarvisBubble.textContent = "";

        conversationHistory.push({ role: "user", content: text });
        conversationHistory.push({ role: "assistant", content: reply });
        localStorage.setItem("jarvis_chat_v18", JSON.stringify(conversationHistory.slice(-10)));

        const cursor = document.createElement("span");
        cursor.className = "cursor";
        jarvisBubble.appendChild(cursor);
        await ultraFastTypeWriter(reply, jarvisBubble, cursor);

      } catch (err) {
        jarvisBubble.classList.remove("cooking");
        jarvisBubble.textContent = `Diagnostic Alert: ${err.message}`;
      }
    });

    function appendMessage(text, sender) {
      const div = document.createElement("div");
      div.className = `msg ${sender}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    function ultraFastTypeWriter(text, element, cursor) {
      return new Promise((resolve) => {
        let i = 0;
        element.textContent = "";
        element.appendChild(cursor);
        
        const interval = setInterval(() => {
          if (i < text.length) {
            const chunk = text.slice(i, i + 3);
            cursor.insertAdjacentText("beforebegin", chunk);
            i += 3;
            chatBox.scrollTop = chatBox.scrollHeight;
          } else {
            clearInterval(interval);
            cursor.remove();
            resolve();
          }
        }, 4);
      });
    }
  </script>
</body>
</html>
